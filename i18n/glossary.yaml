    vi: "kiểm định | kiểm chứng"
    vi_gloss: ""
    keep_english_in_vi: false
    chapters: [0, 1, 2, 3, 4, 6, 9, 10, 11]
    note: "AMBIGUOUS. ch1 训练/验证/预测 and 在开发集上验证 = 'validation' (on the dev set), vi 'kiểm định (validation)'. ch3, ch4, ch9 (对编辑后的模型进行验证, 答案验证, 推理验证, 验算) = 'verification / check', vi 'kiểm chứng'. 验算 = re-checking a calculation ('tính lại để kiểm tra')."
