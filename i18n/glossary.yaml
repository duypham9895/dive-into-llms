    en: "demonstration | demo"
    vi: "demonstration | demo"
    vi_gloss: "demonstration = ví dụ mẫu (câu hỏi + lời giải) đặt trong prompt"
    keep_english_in_vi: true
    chapters: [1, 2, 8, 9]
    note: "AMBIGUOUS. ch2 CoT context (思维链演示, 演示抽样, 少样本学习的演示) = 'demonstration' (in-context example). ch1/ch8 (演示代码, 运行演示, Demo部署) = 'demo' (a runnable showcase). Both kept English in vi."
  - zh: "脚本"
    en: "notebook | script"
    vi: "notebook | script"
    vi_gloss: "notebook = tệp Jupyter gồm code và lời giải thích; script = tệp lệnh chạy được"
    keep_english_in_vi: true
    chapters: [0, 1, 8, 10, 11]
    note: "AMBIGUOUS. In the top README table column 脚本, every link targets a .ipynb file = 'Notebook' (column header). In ch1/ch8/ch10 prose (执行下述脚本, train.sh脚本, 运行脚本) = 'script'. HF's '[脚本](...run_language_modeling.py)' in ch11 = 'script'. vi keeps 'notebook' / 'script'."
  - zh: "标题"
    en: "title | caption"
    vi: "tiêu đề | caption"
    vi_gloss: ""
    keep_english_in_vi: false
    chapters: [6, 8]
    note: "AMBIGUOUS. ch8 2.5.2 (图像、音频和视频标题的文本嵌入; args[1]: 标题文件路径) = 'caption' (text description paired with an image/audio/video), vi 'caption (chú thích mô tả)'. Elsewhere (ch6 只需提供标题或摘要) = 'title/headline', vi 'tiêu đề'."
  - zh: "断点"
    en: "checkpoint"
    vi: "checkpoint"
    vi_gloss: "bản lưu trọng số mô hình tại một thời điểm huấn luyện"
    keep_english_in_vi: true
    chapters: [8, 9]
    note: "AMBIGUOUS. In ch9 (存放断点和log的路径; 训练后的断点路径) 断点 means a training checkpoint, NOT a debugger breakpoint. Same target as 检查点 and the Latin 'checkpoint'."
  - zh: "嵌入"
    en: "embed | embedding"
    vi: "nhúng | embedding"
    vi_gloss: "embedding = vector số biểu diễn ý nghĩa của văn bản/ảnh/âm thanh"
    keep_english_in_vi: true
    chapters: [0, 5, 7, 8, 9]
    note: "AMBIGUOUS by part of speech. Verb (ch5, ch7: 嵌入水印, 将信息嵌入到文本里) = 'embed', vi 'nhúng'. Noun (ch8 嵌入向量, 文本嵌入, embedding 文件) = 'embedding', vi keeps 'embedding'. 嵌入率 (ch7) = embedding rate."
  - zh: "自我反思"
    en: "self-reflection | Reflexion"
    vi: "tự phản tư | Reflexion"
