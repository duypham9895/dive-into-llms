  - zh: "解码"
    en: "decoding"
    vi: "giải mã"
    vi_gloss: ""
    keep_english_in_vi: false
    chapters: [1, 2, 4, 7, 8]
    note: "Two senses, same words: text-generation decoding (贪婪解码 greedy decoding, 解码器) and steganographic decoding in ch7 (extracting the hidden bits). Keep 'giải mã' for both; never 'decryption' (解密 = decrypt, see 加密)."
  - zh: "编码"
    en: "encoding | coding"
    vi: "mã hóa"
    vi_gloss: ""
    keep_english_in_vi: false
    chapters: [1, 2, 6, 7, 8]
    note: "ch7 霍夫曼编码 / 固定长度编码 = Huffman coding / fixed-length coding; ch8 多模态编码 = multimodal encoding; ch6 加密编码 = encoding by cipher. Where 编码 and 加密 appear in the same passage (ch6, ch7), write 'mã hóa (encoding)' vs 'mã hóa bảo mật (encryption)' so the two stay distinct."
  - zh: "加密"
    en: "encryption / encrypt"
    vi: "mã hóa bảo mật"
    vi_gloss: ""
    keep_english_in_vi: false
    chapters: [6, 7, 10]
    note: "Vietnamese 'mã hóa' alone also means encoding; use 'mã hóa bảo mật' (encryption) whenever 编码 is nearby. 解密 = decrypt ('giải mã bảo mật'); 密文 = ciphertext ('bản mã'); 明文 = plaintext ('bản rõ'); 密钥 = key ('khóa')."
