    en: "value | values"
    vi: "value | giá trị"
    vi_gloss: "value (RL) = tổng phần thưởng kỳ vọng từ một trạng thái"
    keep_english_in_vi: true
    chapters: [1, 2, 6, 9, 10, 11]
    note: "AMBIGUOUS. RL (ch11 价值函数, 值头, Value-based) = 'value', vi keeps 'value'. Human 价值观 (ch1, ch6, ch10, ch11) = 'human values', vi 'hệ giá trị'. Ordinary 价值 (实用价值, 更有价值) = plain 'value', vi 'giá trị'."
