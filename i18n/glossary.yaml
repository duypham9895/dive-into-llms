    vi: "dùng VPN"
    vi_gloss: ""
    keep_english_in_vi: false
    chapters: [1, 2]
    note: "Chinese euphemism (also 科学手段, 科学获取) for getting around the network block on OpenAI, Hugging Face etc. in mainland China. Translate the meaning ('needs a VPN or proxy from mainland China'), not the words; keep it factual."
