site_name: Dive into LLMs (Tiếng Việt · English)
site_description: Unofficial Vietnamese and English translation of 《动手学大模型》 Dive into LLMs
site_url: https://duypham9895.github.io/dive-into-llms/
repo_url: https://github.com/duypham9895/dive-into-llms
edit_uri: ""
copyright: >-
  Original © the authors of 《动手学大模型》 Dive into LLMs
  (github.com/Lordog/dive-into-llms). Translation provided without any licence grant.

docs_dir: docs

# Explicit order (the auto-nav sorted Chapter10 before Chapter2). Paths are relative to
# docs/<lang>/; mkdocs-static-i18n resolves them per language. Titles are English here and
# translated for vi under plugins.i18n.languages[vi].nav_translations. Chapter titles are
# the translated H1 of each chapter README, without the "Dive into LLMs:" prefix.
nav:
  - Home: index.md
  - "1. Fine-Tuning and Deploying Pre-trained Language Models":
      - Tutorial: chapter1/README.md
      - Slide notes: chapter1/slides.md
  - "2. Prompting and Chain-of-Thought for Large Models":
      - Tutorial: chapter2/README.md
      - Slide notes: chapter2/slides.md
  - "3. Knowledge Editing for Large Models":
      - Tutorial: chapter3/README.md
      - Slide notes: chapter3/slides.md
  - "4. Mathematical Reasoning with LLMs":
      - Tutorial: chapter4/README.md
      - Notebook: chapter4/sft_math.md
      - Slide notes: chapter4/slides.md
  - "5. Model Watermarking":
      - Tutorial: chapter5/README.md
      - Slide notes: chapter5/slides.md
  - "6. Jailbreak Attacks on Large Models":
      - Tutorial: chapter6/README.md
      - Slide notes: chapter6/slides.md
  - "7. Text Steganography with LLMs":
      - Tutorial: chapter7/README.md
      - Slide notes: chapter7/slides.md
  - "8. Multimodal Large Language Models":
      - Tutorial: chapter8/README.md
      - Slide notes: chapter8/slides.md
  - "9. Building GUI Agents":
      - Tutorial: chapter9/README.md
      - Notebook: chapter9/GUIagent.md
      - Slide notes: chapter9/slides.md
  - "10. LLM Agent Safety":
      - Tutorial: chapter10/README.md
      - Slide notes: chapter10/slides.md
  - "11. RLHF":
      - Tutorial: chapter11/README.md
      - Notebook: chapter11/RLHF.md
      - Slide notes: chapter11/slides.md

theme:
  name: material
  custom_dir: overrides
  language: vi
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - tables
  - md_in_html
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

# MathJax's default config already reads the \( \) delimiters arithmatex emits (ch10).
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      languages:
        - locale: vi
          default: true
          name: Tiếng Việt
          build: true
          nav_translations:
            Home: Trang chủ
            Tutorial: Bài hướng dẫn
            Slide notes: Ghi chú slide
            "1. Fine-Tuning and Deploying Pre-trained Language Models": "1. Fine-tuning và triển khai mô hình ngôn ngữ pre-trained"
            "2. Prompting and Chain-of-Thought for Large Models": "2. Prompting và chain-of-thought cho mô hình lớn"
            "3. Knowledge Editing for Large Models": "3. Knowledge editing cho mô hình lớn"
            "4. Mathematical Reasoning with LLMs": "4. Suy luận toán học với LLM"
            "5. Model Watermarking": "5. Watermark cho mô hình"
            "6. Jailbreak Attacks on Large Models": "6. Tấn công jailbreak trên mô hình lớn"
            "7. Text Steganography with LLMs": "7. Steganography văn bản bằng LLM"
            "8. Multimodal Large Language Models": "8. Multimodal large language model"
            "9. Building GUI Agents": "9. Xây dựng GUI agent"
            "10. LLM Agent Safety": "10. An toàn của LLM agent"
            "11. RLHF": "11. RLHF (học tăng cường từ phản hồi của con người)"
        - locale: en
          name: English
          build: true

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
